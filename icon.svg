<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- cleared.chat mark: one shape, two readings. The thick ring is a zero
       (inbox zero, the whole promise of the product) and the tail turns the
       same ring into a speech bubble. Geometry is heavy and centered so it
       survives a 16px taskbar. -->
  <rect width="512" height="512" rx="96" fill="#087D86"/>

  <!-- Ring + tail as one filled path so they read as a single object.
       evenodd punches the counter (the hole that makes it a zero). -->
  <path fill-rule="evenodd" fill="#FFFFFF" d="
    M256 104
    C339.9 104 408 172.1 408 256
    C408 339.9 339.9 408 256 408
    C230.4 408 206.2 401.6 185 390.4
    L128 408
    L146.6 352.4
    C133.7 330.5 126 305.1 126 278
    L126 256
    C126 172.1 172.1 104 256 104
    Z
    M256 186
    C217.3 186 186 217.3 186 256
    C186 294.7 217.3 326 256 326
    C294.7 326 326 294.7 326 256
    C326 217.3 294.7 186 256 186
    Z
  "/>
</svg>
